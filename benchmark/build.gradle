import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id "com.android.test"
    id "androidx.baselineprofile"
}

android {
    namespace = "com.yunfie.illustia.benchmark"
    compileSdk = 37

    defaultConfig {
        minSdk = 29
        targetSdk = 36
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    targetProjectPath = ":app"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions.managedDevices.localDevices {
        pixel6Api35 {
            device = "Pixel 6"
            apiLevel = 35
            systemImageSource = "aosp"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.fromTarget("17")
        moduleName = "illustia_benchmark"
    }
}

baselineProfile {
    managedDevices = ["pixel6Api35"]
    useConnectedDevices = false
}

dependencies {
    constraints {
        def wireVersion = "6.4.5"
        implementation("com.squareup.wire:wire-runtime:${wireVersion}") {
            because "GHSA-9rm7-3qhh-h2mc: validate protobuf lengths before advancing decoder cursors"
        }
        implementation("com.squareup.wire:wire-runtime-jvm:${wireVersion}") {
            because "Keep the JVM implementation aligned with the patched Wire runtime"
        }
    }
    implementation libs.androidx.test.junit
    implementation libs.androidx.test.runner
    implementation libs.uiautomator
    implementation libs.benchmark.macro
}
