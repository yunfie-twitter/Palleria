ktlint {
    version = "1.8.0"
    outputToConsole = true
    ignoreFailures = false
    filter {
        exclude { element ->
            element.file.absolutePath.replace('\\', '/').contains('/build/generated/')
        }
    }
}

compose.resources {
    publicResClass = true
    packageOfResClass = "com.yunfie.illustia.resources"
}

kotlin {
    androidLibrary {
        namespace = "com.yunfie.illustia.compose"
        compileSdk = 37
        minSdk = 24
    }

    // iOS targets. Apple's linker only exists on macOS, so these are declared unconditionally but
    // only produce artefacts on a macOS host (the `ios` CI job); elsewhere Kotlin skips them and
    // the Android build is unaffected.
    iosArm64 { binaries.framework { baseName = "ComposeApp"; isStatic = true } }
    iosSimulatorArm64 { binaries.framework { baseName = "ComposeApp"; isStatic = true } }

    sourceSets {
        commonMain.dependencies {
            api(project(":shared"))

            implementation compose.runtime
            implementation compose.foundation
            implementation compose.ui
            implementation compose.material3
            api compose.components.resources

            implementation libs.miuix.ui
            implementation libs.miuix.icons
            implementation libs.miuix.squircle
            implementation libs.miuix.preference
            // Publishes iosArm64/iosSimulatorArm64 variants, so the Liquid Glass surface is shared.
            implementation libs.miuix.blur

            implementation libs.kotlinx.coroutines.core
            implementation libs.serialization.json
            implementation libs.coil.compose
            implementation libs.coil.gif
        }

        androidMain.dependencies {
            implementation libs.miuix.navigation3.ui
            implementation libs.navigation3.runtime
            implementation libs.coil.network.okhttp
            implementation libs.lifecycle.viewmodel.compose
            implementation libs.lifecycle.runtime.compose
        }

        commonTest.dependencies {
            implementation libs.kotlin.test
        }
    }
}
