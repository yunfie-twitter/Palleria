name: Bug Report
description: Report a malfunction, crash, or unexpected behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.  
        Please provide as much detail as possible, including reproduction steps, device information, and logs.

  - type: textarea
    id: description
    attributes:
      label: Summary
      description: Provide a concise description of the issue.
      placeholder: "Example: The app crashes on startup"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Describe the steps required to reproduce the issue.
      placeholder: |
        1. Launch the app
        2. Open the Settings screen
        3. The app crashes
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: Enter the version of the app where the issue occurred.
      placeholder: "Example: v1.2.3"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Enter the device name or model.
      placeholder: "Example: Pixel 7"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android Version
      description: Enter the Android version.
      placeholder: "Example: Android 14"
    validations:
      required: true

  - type: dropdown
    id: build-type
    attributes:
      label: Build Type
      description: Select the build type where the issue occurred.
      options:
        - Release
        - Debug
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe what should happen instead.
      placeholder: "Example: The Settings screen should open normally"
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Describe what actually happens.
      placeholder: "Example: The app crashes immediately after opening the Settings screen"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Attach Logcat output, error messages, screenshots, or screen recordings if available.
      placeholder: |
        ```logcat
        Paste logs here
        ```
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have confirmed that the issue occurs with the latest version.
          required: true
        - label: I have not included any personal information, API keys, credentials, or other sensitive information.
          required: true
