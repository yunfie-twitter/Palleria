# Reuse existing repository labels. File paths do not imply bug/feature intent.
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"
          - "LICENSE"
          - "NOTICE"

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/dependabot.yml"
          - "**/build.gradle"
          - "**/build.gradle.kts"
          - "**/settings.gradle"
          - "**/settings.gradle.kts"
          - "gradle/libs.versions.toml"
          - "gradle/wrapper/**"
          - "**/Cargo.toml"
          - "**/Cargo.lock"
          - "**/package.json"
          - "**/package-lock.json"

i18n:
  - changed-files:
      - any-glob-to-any-file:
          - "**/src/**/res/values*/strings*.xml"
          - "fdroid/metadata/*/**"

rust:
  - changed-files:
      - any-glob-to-any-file:
          - "rust/**"
          - "**/*.rs"
          - "**/uniffi.toml"

java:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.java"
          - "**/*.kt"
          - "**/*.kts"

javascript:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.js"
          - "**/*.ts"
          - "**/*.mjs"
          - "**/*.cjs"
          - "**/*.jsx"
          - "**/*.tsx"
