name: Kotlin quality

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "benchmark/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/kotlin-quality.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "benchmark/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/kotlin-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-quality:
    name: Run ktlint and detekt
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run Kotlin quality checks
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            :app:checkQualityBaselineBudgets \
            :app:ktlintMainSourceSetCheck \
            :app:ktlintTestSourceSetCheck \
            :app:detekt \
            --continue \
            --stacktrace \
            --no-build-cache \
            --no-daemon 2>&1 \
            | tee kotlin-quality.log
