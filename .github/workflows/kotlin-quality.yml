name: Kotlin quality

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "benchmark/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/kotlin-quality.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "benchmark/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/kotlin-quality.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ktlint, detekt, and Android Lint used to be three workflows, each paying for its
  # own Gradle start and dependency resolution. They now share a single job so that
  # work happens once, and one daemon is reused across all invocations.
  kotlin-quality:
    name: Run ktlint, detekt, and Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      # The Gradle caches are populated on main; PRs only read them, so an untrusted
      # fork cannot poison the cache used by subsequent trusted builds.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run ktlint and detekt
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            :app:checkQualityBaselineBudgets \
            :app:ktlintMainSourceSetCheck \
            :app:ktlintTestSourceSetCheck \
            :app:detekt \
            --continue \
            --stacktrace \
            --build-cache 2>&1 \
            | tee kotlin-quality.log

      - name: Run Android Lint
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug \
            --stacktrace \
            --build-cache 2>&1 \
            | tee android-lint.log

      # Lint failures do not abort the run, so the SARIF upload stays informative.
      - name: Upload Lint SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint

      - name: Upload logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: kotlin-quality-logs
          path: |
            kotlin-quality.log
            android-lint.log
          retention-days: 3
          if-no-files-found: ignore
