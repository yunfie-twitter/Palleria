name: Update F-Droid Repository

on:
  release:
    types: [published, deleted]

permissions:
  # Release assets need contents: read; gh-pages pushes need contents: write.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      # Shared with docs.yml, because both update the same branch.
      group: gh-pages-publish
      cancel-in-progress: false
      queue: max
    steps:
      # Run the maintained publishing code, not code from an old release tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Restore existing Pages content
        shell: bash
        run: |
          set -euo pipefail
          mkdir public
          git ls-remote --heads origin refs/heads/gh-pages > pages-ref.txt
          if [ -s pages-ref.txt ]; then
            git fetch origin refs/heads/gh-pages
            git archive FETCH_HEAD | tar -x -C public
          fi

      - name: Download or remove release APKs
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/release_pipeline.py sync

      - name: Set up Java
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "17"
          distribution: temurin

      - name: Install fdroidserver
        if: steps.sync.outputs.changed == 'true'
        run: pipx install fdroidserver

      - name: Update and sign F-Droid indexes
        if: steps.sync.outputs.changed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          python .github/scripts/release_pipeline.py index
          cd public
          "$HOME/.local/bin/fdroid" update --create-metadata --pretty

      - name: Remove signing credentials
        if: always()
        run: rm -f release.keystore public/config.yml

      - name: Deploy to GitHub Pages
        if: steps.sync.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          # public already contains the complete site; deletions must propagate.
          keep_files: false
          exclude_assets: '.github,config.yml,*.keystore'
