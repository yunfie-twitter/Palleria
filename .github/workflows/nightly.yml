name: Nightly Clean Build

on:
  schedule:
    # 毎日深夜 3:00 JST (UTC 18:00) に定期実行
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-build:
    name: Clean Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-4.0.0

      - name: Install cargo-ndk
        run: |
          if [ ! -f ~/.cargo/bin/cargo-ndk ]; then
            cargo install cargo-ndk --locked
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # キャッシュなしで全ユニットテストを実行
      - name: Run Unit Tests (Clean)
        run: ./gradlew clean :app:testDebugUnitTest --no-build-cache

      # リリースビルドの生成可否を検証 (assembleRelease / 署名不要のタスク検証)
      - name: Run Release APK Assembly Check
        run: ./gradlew :app:assembleRelease --no-build-cache
        env:
          KEYSTORE_PATH: ""
