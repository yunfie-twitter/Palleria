name: Nightly Build

# develop の内容を nightly ブランチへマージし、リリースと同一の最適化設定で
# 署名済み APK を生成します。

on:
  schedule:
    # 毎日深夜 3:00 JST (UTC 18:00)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

# nightly ブランチへの push と成果物アップロードが重ならないようにします。
concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  nightly:
    name: Merge develop into nightly and build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout nightly
        uses: actions/checkout@v7
        with:
          ref: nightly
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # 既に nightly に取り込まれたバージョンを数えて、次の ISO 週バージョンを決めます
      # （例: 26w46a -> 26w46b -> 26w46c）。マージ前に実行する必要があります。
      - name: Generate nightly version
        id: version
        shell: bash
        run: python .github/scripts/nightly_version.py

      - name: Merge develop into nightly
        id: merge
        shell: bash
        env:
          NIGHTLY_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin develop nightly

          if git merge-base --is-ancestor origin/develop origin/nightly; then
            echo "nightly is already up to date with develop."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The version is part of the subject so the next run can see it in the log.
          if ! git merge --no-ff --no-edit origin/develop -m "chore(nightly): $NIGHTLY_VERSION merge develop into nightly"; then
            echo "::error::Merge conflict between develop and nightly. Resolve it manually on the nightly branch."
            git merge --abort || true
            exit 1
          fi

          git push origin HEAD:nightly

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Merged origin/develop into nightly at $(git rev-parse --short HEAD)."

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      # release-apk.yml と同じ Gradle / キャッシュ設定に揃えます。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.4.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/pixiv-api -> rust/target"
          cache-on-failure: true

      - name: Cache cargo-ndk
        uses: actions/cache@v6
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-4.0.0

      - name: Set up Rust Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android

          if [ ! -f ~/.cargo/bin/cargo-ndk ]; then
            cargo install cargo-ndk --locked
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          chmod 600 release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # リリースビルドと同じ最適化 (minify / shrinkResources / baseline profile) を通します。
      - name: Build Release APKs
        shell: bash
        run: |
          set -o pipefail
          echo "Building nightly ${{ steps.version.outputs.version }} (versionCode ${{ steps.version.outputs.version_code }})"
          ./gradlew assembleRelease 2>&1 | tee gradle-nightly-build.log
        env:
          KEYSTORE_PATH: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

          NIGHTLY_VERSION_NAME: ${{ steps.version.outputs.version }}
          NIGHTLY_VERSION_CODE: ${{ steps.version.outputs.version_code }}

          TURN_URL: ${{ secrets.TURN_URL }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_PASSWORD: ${{ secrets.TURN_PASSWORD }}

      - name: Verify universal and split APKs
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          APKS=(app/build/outputs/apk/release/*.apk)
          UNIVERSAL_APKS=(app/build/outputs/apk/release/*-universal.apk)
          SPLIT_APKS=(
            app/build/outputs/apk/release/*-arm64-v8a.apk
            app/build/outputs/apk/release/*-armeabi-v7a.apk
            app/build/outputs/apk/release/*-x86_64.apk
          )

          if [ ${#UNIVERSAL_APKS[@]} -ne 1 ]; then
            echo "Expected exactly one universal APK, found ${#UNIVERSAL_APKS[@]}."
            exit 1
          fi

          if [ ${#SPLIT_APKS[@]} -ne 3 ]; then
            echo "Expected ABI splits for arm64-v8a, armeabi-v7a, and x86_64; found ${#SPLIT_APKS[@]}."
            exit 1
          fi

          echo "Found ${#APKS[@]} APK(s):"

          for APK in "${APKS[@]}"; do
            echo "  $APK"
          done

      # 署名が本当に入っているかを検証します。apksigner はランナーの
      # build-tools に存在しない場合があるため、APK 内の署名ブロックを直接確認します。
      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail

          for APK in app/build/outputs/apk/release/*.apk; do
            if ! unzip -l "$APK" | grep -qE 'META-INF/.*\.(RSA|DSA|EC|SF)'; then
              echo "::error::$APK is not signed."
              exit 1
            fi
            echo "Signature OK: $APK"
          done

          # 本番 keystore で署名できていなければ、配布物として意味がありません。
          if [ ! -s release.keystore ]; then
            echo "::error::release.keystore is missing or empty; APKs were not signed with the release key."
            exit 1
          fi

      - name: Verify injected version
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="${{ steps.version.outputs.version }}"

          # ファイル名は versionName から生成されるため、注入が効いたかを直接確認できます。
          if ! ls app/build/outputs/apk/release/*-"$EXPECTED"-release-universal.apk > /dev/null 2>&1; then
            echo "::error::No APK named after the generated version $EXPECTED was produced."
            ls -1 app/build/outputs/apk/release/ || true
            exit 1
          fi

          echo "Version $EXPECTED was injected into the build."

      - name: Upload Nightly APKs
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: nightly-apks-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3

      - name: Upload build log on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: nightly-build-log-${{ github.run_number }}
          path: gradle-nightly-build.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Remove signing key
        if: always()
        run: rm -f release.keystore
