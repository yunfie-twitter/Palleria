name: Generate Baseline Profile

on:
  schedule:
    # 毎月第1月曜日の朝 04:00 JST (前日日曜日 UTC 19:00) に自動生成
    - cron: "0 19 1-7 * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-baseline-profile
  cancel-in-progress: true

jobs:
  generate-profile:
    name: Generate Baseline Profile via GMD
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM group perms for Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-4.0.0

      - name: Install cargo-ndk
        run: |
          if [ ! -f ~/.cargo/bin/cargo-ndk ]; then
            cargo install cargo-ndk --locked
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Baseline Profile Generation on GMD
        run: |
          ./gradlew :benchmark:pixel6Api35BaselineProfile \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Dorg.gradle.workers.max=2 \
            --stacktrace

      - name: Create Pull Request for Updated Baseline Profile
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "perf(profile): update generated baseline profile"
          title: "perf(profile): update generated baseline profile"
          body: |
            ## Automated Baseline Profile Update

            This PR was automatically generated by the [generate-baseline-profile.yml](.github/workflows/generate-baseline-profile.yml) workflow using Gradle Managed Devices (Pixel 6 API 35).

            Updating Baseline Profiles enhances app startup time (TTID / TTFD) and eliminates UI jank by pre-compiling critical code paths ahead of time (AOT).
          branch: "perf/auto-update-baseline-profile"
          base: "main"
          delete-branch: true
          labels: |
            enhancement
