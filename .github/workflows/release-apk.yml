name: Build Draft APK Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/build.gradle"]
  workflow_dispatch:

permissions:
  contents: write

# Tag and main pushes may refer to the same version; do not race draft uploads.
concurrency:
  group: apk-draft-release
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version and preserve release tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/release_pipeline.py prepare

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.4.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/pixiv-api -> rust/pixiv-api/target"

      - name: Cache cargo-ndk
        uses: actions/cache@v6
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-4.0.0

      - name: Set up Rust Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android

          if [ ! -f ~/.cargo/bin/cargo-ndk ]; then
            cargo install cargo-ndk --locked
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          chmod 600 release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee gradle-release-build.log
        env:
          KEYSTORE_PATH: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

          TURN_URL: ${{ secrets.TURN_URL }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_PASSWORD: ${{ secrets.TURN_PASSWORD }}

      - name: Verify universal and split APKs
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          APKS=(app/build/outputs/apk/release/*.apk)
          UNIVERSAL_APKS=(app/build/outputs/apk/release/*-universal.apk)
          SPLIT_APKS=(
            app/build/outputs/apk/release/*-arm64-v8a.apk
            app/build/outputs/apk/release/*-armeabi-v7a.apk
            app/build/outputs/apk/release/*-x86_64.apk
          )

          if [ ${#UNIVERSAL_APKS[@]} -ne 1 ]; then
            echo "Expected exactly one universal APK, found ${#UNIVERSAL_APKS[@]}."
            exit 1
          fi

          if [ ${#SPLIT_APKS[@]} -ne 3 ]; then
            echo "Expected ABI splits for arm64-v8a, armeabi-v7a, and x86_64; found ${#SPLIT_APKS[@]}."
            exit 1
          fi

          echo "Found ${#APKS[@]} APK(s), including one universal APK and three ABI splits:"

          for APK in "${APKS[@]}"; do
            echo "  $APK"
          done

      # Re-check after the build in case a maintainer published the draft.
      - name: Refuse to modify a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python .github/scripts/release_pipeline.py guard

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/*.apk

      - name: Remove signing key
        if: always()
        run: rm -f release.keystore
