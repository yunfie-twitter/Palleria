name: Compose Compiler Metrics & Stability

on:
  push:
    branches: ["main"]
    paths:
      - "app/src/main/**"
      - "app/build.gradle"
      - "compose_compiler_config.conf"
      - ".github/workflows/compose-metrics.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/src/main/**"
      - "app/build.gradle"
      - "compose_compiler_config.conf"
      - ".github/workflows/compose-metrics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-metrics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-metrics:
    name: Compose Stability & Recomposition Audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile with Compose Compiler Metrics & Reports
        run: |
          ./gradlew :app:compileReleaseKotlin \
            -PcomposeCompilerMetrics=true \
            -PcomposeCompilerReports=true \
            --stacktrace

      - name: Parse Compose Metrics & Generate Summary
        run: |
          python scripts/parse_compose_metrics.py

      - name: Upload Compose Compiler Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compose-metrics-reports
          path: |
            app/build/compose_metrics/
            app/build/compose_reports/
          retention-days: 3
