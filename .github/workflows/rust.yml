name: Rust

on:
  push:
    branches: ["main"]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: rust/pixiv-api

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/pixiv-api -> rust/pixiv-api/target"

      - name: Check formatting
        run: cargo fmt --check 2>&1 | tee cargo-fmt.log

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee cargo-clippy.log

      - name: Run tests
        run: cargo test --all-features 2>&1 | tee cargo-test.log
