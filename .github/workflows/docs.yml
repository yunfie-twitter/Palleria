name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "fdroid/metadata/com.yunfie.illustia/en-US/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Cache VitePress
        uses: actions/cache@v6
        with:
          path: docs/.vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('docs/**', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs:build

      - name: Preserve F-Droid repository
        run: |
          set -euo pipefail
          mkdir old-pages
          git ls-remote --heads origin refs/heads/gh-pages > pages-ref.txt
          if [ -s pages-ref.txt ]; then
            git fetch origin refs/heads/gh-pages
            git archive FETCH_HEAD | tar -x -C old-pages
          fi

          for directory in repo metadata tmp; do
            if [ -d "old-pages/${directory}" ]; then
              cp -a "old-pages/${directory}" "docs/.vitepress/dist/${directory}"
            fi
          done

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/.vitepress/dist
          publish_branch: gh-pages
          force_orphan: false
