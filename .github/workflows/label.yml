name: Pull Request Labeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Read configuration through the API; never check out or execute PR code.
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          # Preserve labels added manually, even when the changed files evolve.
          sync-labels: false
