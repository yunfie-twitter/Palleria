[package]
name = "palleria_pixiv_api"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
bench = []

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream"] }
futures-util = "0.3"
rayon = "1.10"
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
md5 = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = { version = "0.29", features = ["cli", "tokio"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
criterion = "0.5"
tiny_http = "0.12"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

[[bench]]
name = "illust_decode"
harness = false

[[bench]]
name = "image_analysis"
harness = false

