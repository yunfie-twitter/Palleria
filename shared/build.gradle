import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.kotlin.multiplatform)
    alias(libs.plugins.android.kmp.library)
    alias(libs.plugins.compose.multiplatform)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.ktlint)
}

ktlint {
    version = "1.8.0"
    outputToConsole = true
    ignoreFailures = false
    filter {
        exclude { element ->
            element.file.absolutePath.replace('\\', '/').contains('/build/generated/')
        }
    }
}

kotlin {
    androidLibrary {
        namespace = "com.yunfie.illustia.shared"
        compileSdk = 37
        minSdk = 24

        compilations.configureEach {
            compilerOptions {
                jvmTarget = JvmTarget.fromTarget("17")
            }
        }
    }

    // See composeApp/build.gradle: declared everywhere, only linked on macOS.
    // Platform implementations (repository, settings, file system) live here, so the
    // ComposeApp framework links against this one.
    iosArm64 { binaries.framework { baseName = "Shared"; isStatic = true } }
    iosSimulatorArm64 { binaries.framework { baseName = "Shared"; isStatic = true } }

    sourceSets {
        commonMain.dependencies {
            implementation compose.runtime

            implementation libs.kotlinx.coroutines.core
            implementation libs.serialization.json
            // commonMain には synchronized が無いため、ロック付きキャッシュを
            // マルチプラットフォームで書くために atomicfu を使う。
            implementation libs.atomicfu
            // Exposed to composeApp so shared UI can format timestamps without java.text.
            api libs.kotlinx.datetime

            implementation libs.ktor.client.core
            implementation libs.ktor.client.content.negotiation
            implementation libs.ktor.serialization.json
        }

        androidMain.dependencies {
            implementation libs.ktor.client.okhttp
            implementation libs.okhttp
            implementation libs.lifecycle.viewmodel.ktx
        }

        iosMain.dependencies {
            implementation libs.ktor.client.darwin
        }

        commonTest.dependencies {
            implementation libs.kotlin.test
            implementation libs.kotlinx.coroutines.test
            implementation libs.ktor.client.mock
        }

        androidTest.dependencies {
            implementation libs.kotlin.test
            implementation libs.kotlinx.coroutines.test
            implementation libs.ktor.client.mock
        }
    }
}
