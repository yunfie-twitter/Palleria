ext.releaseKeystorePath = System.getenv("KEYSTORE_PATH")
def androidMinSdk = 24

android {
    namespace = "com.yunfie.illustia"
    // 一部の AndroidX / miuix AAR が API 37.2 以上でのコンパイルを要求する。
    // targetSdk は 37 のまま（実行時挙動は変えない）。
    compileSdk = 37
    compileSdkMinor = 2
    defaultConfig {
        applicationId = "com.yunfie.illustia"
        // Android 7.0 (API 24) and newer.
        minSdk = androidMinSdk
        targetSdk = 37
        // CI overrides these for nightly builds. The literals below stay the source of
        // truth for releases: .github/scripts/release_pipeline.py parses them.
        versionCode = (System.getenv("BUILD_VERSION_CODE") ?: "212").toInteger()
        versionName = System.getenv("BUILD_VERSION_NAME") ?: "7.3.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (project.ext.releaseKeystorePath) {
            release {
                storeFile = file(project.ext.releaseKeystorePath)
                storePassword = System.getenv("KEYSTORE_PASSWORD")
                keyAlias = System.getenv("KEY_ALIAS")
                keyPassword = System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig = project.ext.releaseKeystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }



    buildFeatures {
        compose = true
    }

    packaging {
        jniLibs {
            keepDebugSymbols += ["**/libandroidx.graphics.path.so"]
        }
    }

    // Publish one installable universal APK and ABI-specific APKs. The universal
    // output remains the compatibility fallback for F-Droid clients and manual
    // installation; split outputs reduce download size on supported devices.
    //
    // AGP 9.5 exposes no per-variant switch for splits, so this is global. The
    // release pipeline needs the splits, hence the default of true; local debug
    // iteration can skip the extra packaging/signing with -Ppalleria.splits=false
    // (you still get the universal APK).
    splits {
        abi {
            enable = (findProperty("palleria.splits") ?: "true").toString().toBoolean()
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk = true
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Robolectric's Android shared-memory setup accesses FileDescriptor via SharedSecrets.
            jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
            useJUnitPlatform()
        }
    }

    lint {
        abortOnError false
        sarifReport true
        textReport true
        htmlReport true
        informational 'MissingTranslation'
        warning 'StringFormatInvalid'
    }
}

composeCompiler {
