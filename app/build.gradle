tasks.matching {
    (it.name.startsWith("merge") || it.name.startsWith("strip")) &&
        (it.name.contains("NativeLibs") || it.name.contains("JniLib"))
}.configureEach { task ->
    if (task.name.toLowerCase(Locale.ROOT).contains("release")) {
        task.dependsOn(rustAndroidTasks["Release"])
    } else if (task.name.toLowerCase(Locale.ROOT).contains("debug")) {
        task.dependsOn(rustAndroidTasks["Debug"])
    }
}

