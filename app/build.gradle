ext.releaseKeystorePath = System.getenv("KEYSTORE_PATH")
def androidMinSdk = 24

android {
    namespace "com.yunfie.illustia"
    compileSdk 37
    defaultConfig {
        applicationId "com.yunfie.illustia"
        // Android 7.0 (API 24) and newer.
        minSdk androidMinSdk
        targetSdk 36
        versionCode 86
        versionName "5.8.1"
    }

    signingConfigs {
        if (project.ext.releaseKeystorePath) {
            release {
                storeFile file(project.ext.releaseKeystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig project.ext.releaseKeystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }



    buildFeatures {
        compose true
    }

    sourceSets {
        main.kotlin.srcDir "$buildDir/generated/uniffi/kotlin"
        main.jniLibs.srcDir "$buildDir/generated/uniffi/jniLibs"
    }

    packaging {
        jniLibs {
            keepDebugSymbols += ["**/libandroidx.graphics.path.so"]
        }
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

ktlint {
    version = "1.8.0"
    android = true
    outputToConsole = true
    ignoreFailures = false
    filter {
        // Generated UniFFI sources are attached to the Android main source set.
        // A path predicate is required because glob filtering is unreliable for
        // dynamically attached source directories in ktlint-gradle.
        exclude { element ->
            element.file.absolutePath.replace('\\', '/').contains('/build/generated/')
        }
    }
}

detekt {
    toolVersion = "2.0.0-alpha.5"
    buildUponDefaultConfig = true
    config.setFrom(files("config/detekt/detekt.yml"))
    parallel = true
    ignoreFailures = false
}

def supportedKtlintCheckTasks = [
    "runKtlintCheckOverMainSourceSet",
    "runKtlintCheckOverTestSourceSet",
    "runKtlintCheckOverKotlinScripts",
    "ktlintMainSourceSetCheck",
    "ktlintTestSourceSetCheck",
    "ktlintKotlinScriptCheck",
] as Set

tasks.configureEach { task ->
    if ((task.name.startsWith("runKtlintCheckOver") ||
        (task.name.startsWith("ktlint") && task.name.endsWith("SourceSetCheck"))) &&
        !supportedKtlintCheckTasks.contains(task.name)) {
        task.enabled = false
    }
}

def releaseKeystorePath = System.getenv("KEYSTORE_PATH")

def rustCrateDir = rootProject.file("rust/pixiv-api")
def rustTargetDir = rootProject.file("rust/target")
def hostOperatingSystem = org.gradle.internal.os.OperatingSystem.current()
def cargoExecutable = hostOperatingSystem.isWindows()
    ? new File(System.getProperty("user.home"), ".cargo/bin/cargo.exe").absolutePath
    : "cargo"
def uniffiHostLibraryName = hostOperatingSystem.isWindows()
    ? "palleria_pixiv_api.dll"
    : hostOperatingSystem.isMacOsX()
        ? "libpalleria_pixiv_api.dylib"
        : "libpalleria_pixiv_api.so"
def uniffiHostLibrary = new File(rustTargetDir, "release/${uniffiHostLibraryName}")
def uniffiKotlinDir = layout.buildDirectory.dir("generated/uniffi/kotlin")
def uniffiJniDir = layout.buildDirectory.dir("generated/uniffi/jniLibs")
def rustInputs = files(
    fileTree(new File(rustCrateDir, "src")) { include "**/*.rs" },
    new File(rustCrateDir, "Cargo.toml"),
    new File(rustCrateDir, "Cargo.lock"),
)

tasks.register("buildUniFfiHost", Exec) {
    workingDir rustCrateDir
    environment "CARGO_TARGET_DIR", rustTargetDir
    commandLine cargoExecutable, "build", "--release", "--lib"
    inputs.files(rustInputs)
    outputs.file(uniffiHostLibrary)
}

tasks.register("generateUniFfiBindings", Exec) {
    workingDir rustCrateDir
    environment "CARGO_TARGET_DIR", rustTargetDir
    commandLine cargoExecutable, "run", "--release", "--bin", "uniffi-bindgen", "--", "generate",
        "--library", uniffiHostLibrary,
        "--language", "kotlin", "--out-dir", uniffiKotlinDir.get().asFile, "--no-format"
    dependsOn "buildUniFfiHost"
    inputs.files(rustInputs, new File(rustCrateDir, "uniffi.toml"))
    outputs.file(uniffiKotlinDir.map { it.file("com/yunfie/illustia/rust/palleria_pixiv_api.kt") })
}

tasks.register("buildRustAndroid", Exec) {
    workingDir rustCrateDir
    environment "CARGO_TARGET_DIR", rustTargetDir
    commandLine cargoExecutable, "ndk", "--platform", androidMinSdk.toString(),
        "-t", "arm64-v8a", "-t", "armeabi-v7a", "-t", "x86_64",
        "-o", uniffiJniDir.get().asFile, "build", "--release"
    dependsOn "generateUniFfiBindings"
    inputs.files(rustInputs)
    outputs.files(
        uniffiJniDir.map { it.file("arm64-v8a/libpalleria_pixiv_api.so") },
        uniffiJniDir.map { it.file("armeabi-v7a/libpalleria_pixiv_api.so") },
        uniffiJniDir.map { it.file("x86_64/libpalleria_pixiv_api.so") },
    )
}

tasks.register("buildPallaSyncCoreAndroid", Exec) {
    def pallaSyncCoreCrateDir = rootProject.file("rust/pallasync-core")
    workingDir pallaSyncCoreCrateDir
    environment "CARGO_TARGET_DIR", rustTargetDir
    commandLine cargoExecutable, "ndk", "--platform", androidMinSdk.toString(),
        "-t", "arm64-v8a", "-t", "armeabi-v7a", "-t", "x86_64",
        "-o", uniffiJniDir.get().asFile, "build", "--release"
}

def detektBaselineBudget = 400
def detektRuleBudgets = [
    ComplexCondition: 11,
    ConstructorParameterNaming: 2,
    CyclomaticComplexMethod: 18,
    EmptyFunctionBlock: 2,
    InvalidPackageDeclaration: 0,
    LargeClass: 3,
    LongMethod: 15,
    LoopWithTooManyJumpStatements: 3,
    MagicNumber: 102,
    MatchingDeclarationName: 5,
    ReturnCount: 52,
    SwallowedException: 0,
    ThrowsCount: 2,
    TooGenericExceptionCaught: 0,
    TooGenericExceptionThrown: 1,
    TooManyFunctions: 28,
    UnusedParameter: 7,
    VariableNaming: 3,
]

tasks.register("checkQualityBaselineBudgets") {
    group = "verification"
    description = "Fails when static-analysis baselines grow beyond their approved budgets."
    def detektBaselineFile = file("detekt-baseline.xml")
    inputs.file(detektBaselineFile)

    doLast {
        def detektCount = detektBaselineFile.readLines().count { it.contains("<ID>") }
        def detektEntries = detektBaselineFile.readLines().findAll { it.contains("<ID>") }
        def ruleCounts = detektEntries.countBy { entry ->
            def matcher = entry =~ /<ID>([^:]+):/
            matcher.find() ? matcher.group(1) : "Unknown"
        }
        def exceededRuleBudgets = ruleCounts.findAll { rule, count ->
            !detektRuleBudgets.containsKey(rule) || count > detektRuleBudgets[rule]
        }
        if (detektCount > detektBaselineBudget) {
            throw new GradleException(
                "detekt baseline has ${detektCount} issues; budget is ${detektBaselineBudget}.",
            )
        }
        if (!exceededRuleBudgets.isEmpty()) {
            throw new GradleException(
                "detekt rule budgets exceeded: ${exceededRuleBudgets.sort().collect { rule, count -> "${rule} ${count}/${detektRuleBudgets[rule] ?: 0}" }.join(', ')}.",
            )
        }
        logger.lifecycle("Quality baseline budget: detekt ${detektCount}/${detektBaselineBudget}; ${ruleCounts.sort()}")
    }
}

tasks.named("preBuild").configure {
    dependsOn "generateUniFfiBindings", "buildRustAndroid", "buildPallaSyncCoreAndroid"
}

