def uniffiKotlinDir = layout.buildDirectory.dir("generated/uniffi/kotlin")
def uniffiJniDir = layout.buildDirectory.dir("generated/uniffi/jniLibs")

// Release builds keep the shipped defaults: all ABIs with the optimized profile.
// Debug builds pay an LTO release build per ABI that is never distributed, so they
// default to one ABI and the fast dev profile. Both knobs affect debug only:
//   -Ppalleria.abis=arm64-v8a                  build only the connected device's ABI
//   -Ppalleria.abis=arm64-v8a,x86_64           build a custom set
//   -Ppalleria.rustProfile=release             force the optimized profile in debug
def rustAbiProperty = findProperty("palleria.abis")?.toString()?.trim()
def rustProfileProperty = findProperty("palleria.rustProfile")?.toString()?.trim()
def debugRustAbis = (rustAbiProperty ?: "arm64-v8a")
    .split(",")
    .collect { it.trim() }
    .findAll { it }
def releaseRustAbis = "arm64-v8a,armeabi-v7a,x86_64"
    .split(",")
    .collect { it.trim() }
def debugRustProfile = (rustProfileProperty ?: "debug").toString()
// Release always uses the optimized profile: the published APKs must not change
// based on a developer's local property.
def releaseRustProfile = "release"
def rustInputs = files(
    fileTree(new File(rustCrateDir, "src")) { include "**/*.rs" },
    new File(rustCrateDir, "Cargo.toml"),
    new File(rustCrateDir, "Cargo.lock"),
)

def buildUniFfiHost = tasks.register("buildUniFfiHost", Exec) {
    workingDir rustCrateDir
    environment "CARGO_TARGET_DIR", rustTargetDir
    // The host library only feeds uniffi-bindgen; its runtime speed is irrelevant.
    commandLine cargoExecutable, "build", "--locked", "--lib"
    inputs.files(rustInputs)
    outputs.file(uniffiHostLibrary)
}

// The generated Kotlin surface is a pure function of the Rust sources and uniffi.toml.
// Marking it cacheable lets read-only CI jobs and clean checkouts reuse it instead of
// invoking cargo again; all inputs are already declared below.
def generateUniFfiBindings = tasks.register("generateUniFfiBindings", Exec) {
    workingDir rustCrateDir
    environment "CARGO_TARGET_DIR", rustTargetDir
    commandLine cargoExecutable, "run", "--locked", "--features", "bindgen", "--bin", "uniffi-bindgen", "--", "generate",
        "--library", uniffiHostLibrary,
        "--config", new File(rustCrateDir, "uniffi.toml").absolutePath,
        "--language", "kotlin", "--out-dir", uniffiKotlinDir.get().asFile, "--no-format"
    dependsOn buildUniFfiHost
    inputs.files(rustInputs, new File(rustCrateDir, "uniffi.toml"))
    inputs.file(uniffiHostLibrary)
    outputs.file(uniffiKotlinDir.map { it.file("com/yunfie/illustia/rust/palleria_pixiv_api.kt") })
    outputs.dir(uniffiKotlinDir)
    outputs.cacheIf { true }
}

// One task per (variant, ABI). Splitting the previous single task lets Gradle run the
// ABIs in parallel and keeps each ABI's output independent, so changing one ABI's
// sources never rebuilds the others. cargo-ndk passes each ABI to cargo separately
// anyway; the only loss is a shared dependency-compile phase, which the global
// cargo-ndk --jobs below keeps saturating.
def rustAndroidTasks = [:]
def registerRustAndroidTasks = { String variantName, List<String> abis, String profile ->
    def perAbi = abis.collect { abi ->
        tasks.register("buildRustAndroid${variantName.capitalize()}${abi.replace('-', '_').capitalize()}", Exec) {
            group = "build"
            description = "Builds libpalleria_pixiv_api.so for ${variantName} ${abi} (${profile})."
            workingDir rustCrateDir
            environment "CARGO_TARGET_DIR", rustTargetDir
            def args = [cargoExecutable, "ndk", "--platform", androidMinSdk.toString(), "-t", abi,
                        "-o", uniffiJniDir.get().asFile.absolutePath, "build", "--locked"]
            if (profile != "debug") args.add("--release")
            args.addAll(["--jobs", gradle.startParameter.maxWorkerCount.toString()])
            commandLine args
            inputs.files(rustInputs)
            inputs.property("abi", abi)
            inputs.property("profile", profile)
            outputs.file(uniffiJniDir.map { it.file("${abi}/libpalleria_pixiv_api.so") })
        }
    }
    def aggregate = tasks.register("buildRustAndroid${variantName.capitalize()}") {
        group = "build"
        description = "Builds the Rust shared libraries for ${variantName}: ${abis.join(', ')} (${profile})."
        dependsOn perAbi
    }
    rustAndroidTasks[variantName] = aggregate
    aggregate
}

registerRustAndroidTasks("Debug", debugRustAbis, debugRustProfile)
registerRustAndroidTasks("Release", releaseRustAbis, releaseRustProfile)

def detektBaselineBudget = 425
// Counted from detekt-baseline.xml after regenerating it for detekt 2.0. The previous ceiling was
// measured against a stale baseline, so it counted far fewer issues than detekt actually reports.
def detektRuleBudgets = [
    ComplexCondition: 18,
    ConstructorParameterNaming: 2,
    CyclomaticComplexMethod: 57,
    DestructuringDeclarationWithTooManyEntries: 1,
    EmptyFunctionBlock: 1,
    InvalidPackageDeclaration: 0,
    LargeClass: 9,
    LongMethod: 83,
    LoopWithTooManyJumpStatements: 9,
    MagicNumber: 113,
    MatchingDeclarationName: 7,
    NestedBlockDepth: 4,
    ReturnCount: 70,
    SwallowedException: 1,
    ThrowsCount: 6,
    TooGenericExceptionCaught: 4,
    TooGenericExceptionThrown: 0,
    TooManyFunctions: 31,
    UnusedParameter: 6,
    VariableNaming: 3,
]

tasks.register("checkQualityBaselineBudgets") {
    group = "verification"
    description = "Fails when static-analysis baselines grow beyond their approved budgets."
    def detektBaselineFile = file("detekt-baseline.xml")
    inputs.file(detektBaselineFile)

    doLast {
        def detektCount = detektBaselineFile.readLines().count { it.contains("<ID>") }
        def detektEntries = detektBaselineFile.readLines().findAll { it.contains("<ID>") }
        def ruleCounts = detektEntries.countBy { entry ->
            def matcher = entry =~ /<ID>([^:]+):/
            matcher.find() ? matcher.group(1) : "Unknown"
        }
        def exceededRuleBudgets = ruleCounts.findAll { rule, count ->
            !detektRuleBudgets.containsKey(rule) || count > detektRuleBudgets[rule]
        }
        if (detektCount > detektBaselineBudget) {
            throw new GradleException(
                "detekt baseline has ${detektCount} issues; budget is ${detektBaselineBudget}.",
            )
        }
        if (!exceededRuleBudgets.isEmpty()) {
            throw new GradleException(
                "detekt rule budgets exceeded: ${exceededRuleBudgets.sort().collect { rule, count -> "${rule} ${count}/${detektRuleBudgets[rule] ?: 0}" }.join(', ')}.",
            )
        }
        logger.lifecycle("Quality baseline budget: detekt ${detektCount}/${detektBaselineBudget}; ${ruleCounts.sort()}")
    }
}

