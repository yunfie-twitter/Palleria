# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
# 4g keeps KSP + Compose + R8 from falling back to repeated GCs on the 283-file
# app module; 1g of metaspace is needed for the extra KSP/R8 class generators.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

# Leave one core for the OS and the Kotlin daemon, which is not counted here.
org.gradle.workers.max=4

# The Kotlin daemon is a separate JVM; give it room so it is not restarted between
# the app and benchmark modules' compilations.
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# Incremental Kotlin compilation is on by default, but configuration caching and
# custom source dirs can silently disable it. Keep it explicit so a regression shows
# up as a build-time change, not a mystery.
kotlin.incremental=true

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK.
android.useAndroidX=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true
android.r8.optimizedResourceShrinking=true

android.nonTransitiveRClass=true

android.enableR8.fullMode=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Security-pinned dependencies are needed in both the Settings and project
# buildscript classloader scopes. Keep their versions in one place.
security.bouncycastleVersion=1.85
security.nettyVersion=4.1.137.Final
security.logbackVersion=1.5.34
security.jdomVersion=2.0.6.1
security.httpClientVersion=4.5.14
security.commonsLangVersion=3.20.0
security.jose4jVersion=0.9.6
