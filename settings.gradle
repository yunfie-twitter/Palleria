pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // Settings plugins use a separate classloader from project build scripts.
        // Keep the security overrides in both scopes, but share all version values.
        def bcVersion = providers.gradleProperty("security.bouncycastleVersion").get()
        def nettyVersion = providers.gradleProperty("security.nettyVersion").get()
        def logbackVersion = providers.gradleProperty("security.logbackVersion").get()
        classpath "org.bouncycastle:bcpkix-jdk18on:${bcVersion}"
        classpath "org.bouncycastle:bcprov-jdk18on:${bcVersion}"
        classpath "org.bouncycastle:bcutil-jdk18on:${bcVersion}"
        classpath "io.netty:netty-codec:${nettyVersion}"
        classpath "io.netty:netty-codec-http:${nettyVersion}"
        classpath "io.netty:netty-codec-http2:${nettyVersion}"
        classpath "io.netty:netty-common:${nettyVersion}"
        classpath "io.netty:netty-handler:${nettyVersion}"
        classpath "io.netty:netty-handler-proxy:${nettyVersion}"
        classpath "ch.qos.logback:logback-core:${logbackVersion}"
        classpath "ch.qos.logback:logback-classic:${logbackVersion}"
        classpath "org.jdom:jdom2:${providers.gradleProperty('security.jdomVersion').get()}"
        classpath "org.apache.httpcomponents:httpclient:${providers.gradleProperty('security.httpClientVersion').get()}"
        classpath "org.apache.commons:commons-lang3:${providers.gradleProperty('security.commonsLangVersion').get()}"
        classpath "org.bitbucket.b_c:jose4j:${providers.gradleProperty('security.jose4jVersion').get()}"
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
    }
}

rootProject.name = "Illustia"
include ":app"
include ":benchmark"
